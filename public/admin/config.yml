backend:
  name: github
  repo: cherrytora/micords_offical_site
  branch: main
  base_url: https://round-butterfly-d457.m85592527.workers.dev

media_folder: public/images
public_folder: /images

# ── YAML anchors for reusable field definitions ──────────────────────────────

_pricing_plan_fields: &pricing_plan_fields
  - {name: id, label: "ID (free/pro/premium)", widget: string}
  - {name: label, label: "Plan Label (FREE/PRO/PREMIUM)", widget: string}
  - {name: tag, label: "Tagline", widget: string}
  - {name: monthlyPrice, label: "Monthly Price", widget: string}
  - {name: annualPrice, label: "Annual Equivalent Monthly Price", widget: string}
  - {name: annualTotal, label: "Annual Total (e.g. NT$780/year)", widget: string, required: false}
  - {name: annualSaveNote, label: "Annual Save Note", widget: string, required: false}
  - {name: popular, label: "Show Popular Banner", widget: boolean, default: false}
  - {name: dark, label: "Dark Card Style (for Premium)", widget: boolean, default: false}
  - {name: cta, label: "CTA Button Text", widget: string}
  - name: features
    label: "Feature List (shown on plan card)"
    widget: list
    field: {name: item, label: "Feature", widget: string}

_pricing_notes_fields: &pricing_notes_fields
  - {name: title, label: "Block Title (with Emoji)", widget: string}
  - name: items
    label: "Note Items"
    widget: list
    field: {name: item, label: "Note Text", widget: text}

_article_fields: &article_fields
  - {name: title, label: "Article Title", widget: string}
  - {name: slug, label: "URL Slug", widget: string}
  - {name: publishDate, label: "Publish Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
  - {name: excerpt, label: "Excerpt", widget: text}
  - name: tags
    label: "Tags"
    widget: list
    required: false
    field: {name: tag, label: "Tag", widget: string}
  - {name: coverImage, label: "Cover Image (optional)", widget: image, required: false}
  - {name: body, label: "Article Content", widget: markdown}

_faq_fields: &faq_fields
  - {name: question, label: "Question", widget: string}
  - {name: answer, label: "Answer", widget: text}

_tutorial_section_fields: &tutorial_section_fields
  - {name: id, label: "Section ID", widget: string}
  - {name: title, label: "Section Title", widget: string}
  - {name: desc, label: "Section Description", widget: text}
  - name: steps
    label: "Steps"
    widget: list
    field: {name: step, label: "Step", widget: string}
  - {name: mediaLabel, label: "Media Label", widget: string}
  - {name: youtubeId, label: "YouTube ID (optional)", widget: string, required: false}

# ── Collections ───────────────────────────────────────────────────────────────

collections:

  # ── 全站設定（CTA URL 統一管理）──────────────
  - name: global
    label: "全站設定"
    files:
      - name: settings
        label: "CTA 按鈕連結"
        file: src/content/global/settings.yaml
        fields:
          - name: ctaUrl
            label: "所有體驗按鈕的連結 URL"
            widget: string
            hint: "修改此欄位即可同步更新全站所有「立即體驗」、「Try Now」、「今すぐ試す」等按鈕的連結"

  # ── 方案與定價（三語）────────────────────────
  - name: pricing
    label: "方案與定價"
    files:
      - name: pricing-zh-tw
        label: "方案與定價（繁中）"
        file: src/content/pricing/zh-tw/page.yaml
        fields:
          - {name: seoTitle, label: "SEO 標題", widget: string}
          - {name: seoDescription, label: "SEO 描述", widget: text}
          - {name: pageTitle, label: "頁面標題", widget: string}
          - {name: pageSubtitle, label: "頁面副標題", widget: string}
          - {name: trialBadge, label: "試用期說明（Badge 文字）", widget: string}
          - {name: periodMonthly, label: "月繳標籤", widget: string}
          - {name: periodAnnual, label: "年繳標籤", widget: string}
          - {name: periodAnnualSave, label: "年繳折扣說明", widget: string}
          - name: plans
            label: "方案列表"
            widget: list
            fields: *pricing_plan_fields
          - name: notes
            label: "說明區塊（訂閱/退款/服務說明/聯絡）"
            widget: list
            fields: *pricing_notes_fields
          - {name: ctaTitle, label: "底部 CTA 標題", widget: string}
          - {name: ctaSubtitle, label: "底部 CTA 副標題", widget: string}
          - {name: ctaButton, label: "底部 CTA 按鈕文字", widget: string}

      - name: pricing-en
        label: "Plans & Pricing (English)"
        file: src/content/pricing/en/page.yaml
        fields:
          - {name: seoTitle, label: "SEO Title", widget: string}
          - {name: seoDescription, label: "SEO Description", widget: text}
          - {name: pageTitle, label: "Page Title", widget: string}
          - {name: pageSubtitle, label: "Page Subtitle", widget: string}
          - {name: trialBadge, label: "Trial Badge Text", widget: string}
          - {name: periodMonthly, label: "Monthly Label", widget: string}
          - {name: periodAnnual, label: "Annual Label", widget: string}
          - {name: periodAnnualSave, label: "Annual Save Note", widget: string}
          - name: plans
            label: "Plans"
            widget: list
            fields: *pricing_plan_fields
          - name: notes
            label: "Note Blocks (subscription/refund/service/contact)"
            widget: list
            fields: *pricing_notes_fields
          - {name: ctaTitle, label: "CTA Title", widget: string}
          - {name: ctaSubtitle, label: "CTA Subtitle", widget: string}
          - {name: ctaButton, label: "CTA Button Text", widget: string}

      - name: pricing-ja
        label: "料金プラン（日本語）"
        file: src/content/pricing/ja/page.yaml
        fields:
          - {name: seoTitle, label: "SEOタイトル", widget: string}
          - {name: seoDescription, label: "SEO説明文", widget: text}
          - {name: pageTitle, label: "ページタイトル", widget: string}
          - {name: pageSubtitle, label: "サブタイトル", widget: string}
          - {name: trialBadge, label: "トライアルバッジ", widget: string}
          - {name: periodMonthly, label: "月払いラベル", widget: string}
          - {name: periodAnnual, label: "年払いラベル", widget: string}
          - {name: periodAnnualSave, label: "年払い割引説明", widget: string}
          - name: plans
            label: "プランリスト"
            widget: list
            fields: *pricing_plan_fields
          - name: notes
            label: "説明ブロック（サブスク/返金/サービス/連絡先）"
            widget: list
            fields: *pricing_notes_fields
          - {name: ctaTitle, label: "CTA タイトル", widget: string}
          - {name: ctaSubtitle, label: "CTA サブタイトル", widget: string}
          - {name: ctaButton, label: "CTA ボタンテキスト", widget: string}

  # ── 毛孩日記（三語）─────────────────────────
  - name: articles-zh-tw
    label: "毛孩日記｜中文"
    label_singular: "文章（中文）"
    folder: src/content/articles/zh-tw
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{publishDate}})"
    fields:
      - {name: title, label: "文章標題", widget: string}
      - {name: slug, label: "URL Slug（英文）", widget: string, hint: "小寫英文與連字號，例如：cat-hyperthyroidism-part-1"}
      - {name: publishDate, label: "發佈日期", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: excerpt, label: "文章摘要", widget: text}
      - name: tags
        label: "標籤"
        widget: list
        required: false
        field: {name: tag, label: "標籤", widget: string}
      - {name: coverImage, label: "封面圖片（選填）", widget: image, required: false}
      - {name: body, label: "文章內容", widget: markdown}

  - name: articles-en
    label: "毛孩日記｜English"
    label_singular: "Article (EN)"
    folder: src/content/articles/en
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{publishDate}})"
    fields:
      - {name: title, label: "Article Title", widget: string}
      - {name: slug, label: "URL Slug", widget: string, hint: "Use the same slug as the zh-tw version"}
      - {name: publishDate, label: "Publish Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: excerpt, label: "Excerpt", widget: text}
      - name: tags
        label: "Tags"
        widget: list
        required: false
        field: {name: tag, label: "Tag", widget: string}
      - {name: coverImage, label: "Cover Image (optional)", widget: image, required: false}
      - {name: body, label: "Article Content", widget: markdown}

  - name: articles-ja
    label: "毛孩日記｜日本語"
    label_singular: "記事（日本語）"
    folder: src/content/articles/ja
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{publishDate}})"
    fields:
      - {name: title, label: "記事タイトル", widget: string}
      - {name: slug, label: "URLスラッグ", widget: string, hint: "繁中版と同じスラッグを使用"}
      - {name: publishDate, label: "公開日", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: excerpt, label: "記事概要", widget: text}
      - name: tags
        label: "タグ"
        widget: list
        required: false
        field: {name: tag, label: "タグ", widget: string}
      - {name: coverImage, label: "カバー画像（任意）", widget: image, required: false}
      - {name: body, label: "記事内容", widget: markdown}

  # ── 更新日誌（三語）─────────────────────────
  - name: release-notes-zh-tw
    label: "更新日誌｜中文"
    label_singular: "版本（中文）"
    folder: src/content/release-notes/zh-tw
    create: true
    slug: "{{version}}"
    summary: "v{{version}} - {{title}}"
    fields:
      - {name: version, label: "版本號", widget: string}
      - {name: date, label: "發佈日期", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: title, label: "標題", widget: string}
      - {name: body, label: "內容", widget: markdown}

  - name: release-notes-en
    label: "更新日誌｜English"
    label_singular: "Release Note (EN)"
    folder: src/content/release-notes/en
    create: true
    slug: "{{version}}"
    summary: "v{{version}} - {{title}}"
    fields:
      - {name: version, label: "Version", widget: string}
      - {name: date, label: "Release Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: title, label: "Title", widget: string}
      - {name: body, label: "Content", widget: markdown}

  - name: release-notes-ja
    label: "更新日誌｜日本語"
    label_singular: "リリースノート（日本語）"
    folder: src/content/release-notes/ja
    create: true
    slug: "{{version}}"
    summary: "v{{version}} - {{title}}"
    fields:
      - {name: version, label: "バージョン", widget: string}
      - {name: date, label: "リリース日", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {name: title, label: "タイトル", widget: string}
      - {name: body, label: "内容", widget: markdown}

  # ── 即將上線功能（三語）──────────────────────
  - name: roadmap-zh-tw
    label: "即將上線功能｜中文"
    label_singular: "功能項目（中文）"
    folder: src/content/roadmap/zh-tw
    create: true
    slug: "{{order}}-{{slug}}"
    fields:
      - {name: order, label: "排序", widget: number, value_type: int}
      - {name: quarter, label: "季度", widget: string}
      - {name: title, label: "標題", widget: string}
      - {name: desc, label: "說明", widget: text}
      - name: status
        label: "狀態"
        widget: select
        options:
          - {label: "已上線", value: done}
          - {label: "開發中", value: building}
          - {label: "規劃中", value: planned}
      - name: features
        label: "功能列表"
        widget: list
        field: {name: item, label: "功能", widget: string}

  - name: roadmap-en
    label: "即將上線功能｜English"
    label_singular: "Roadmap Item (EN)"
    folder: src/content/roadmap/en
    create: true
    slug: "{{order}}-{{slug}}"
    fields:
      - {name: order, label: "Order", widget: number, value_type: int}
      - {name: quarter, label: "Quarter", widget: string}
      - {name: title, label: "Title", widget: string}
      - {name: desc, label: "Description", widget: text}
      - name: status
        label: "Status"
        widget: select
        options:
          - {label: "Launched", value: done}
          - {label: "Building", value: building}
          - {label: "Planned", value: planned}
      - name: features
        label: "Feature List"
        widget: list
        field: {name: item, label: "Feature", widget: string}

  - name: roadmap-ja
    label: "即將上線功能｜日本語"
    label_singular: "ロードマップ項目（日本語）"
    folder: src/content/roadmap/ja
    create: true
    slug: "{{order}}-{{slug}}"
    fields:
      - {name: order, label: "順序", widget: number, value_type: int}
      - {name: quarter, label: "四半期", widget: string}
      - {name: title, label: "タイトル", widget: string}
      - {name: desc, label: "説明", widget: text}
      - name: status
        label: "ステータス"
        widget: select
        options:
          - {label: "リリース済み", value: done}
          - {label: "開発中", value: building}
          - {label: "計画中", value: planned}
      - name: features
        label: "機能リスト"
        widget: list
        field: {name: item, label: "機能", widget: string}

  # ── FAQ（三語）──────────────────────────────
  - name: faq
    label: "FAQ"
    files:
      - name: faq-zh-tw
        label: "FAQ（繁中）"
        file: src/content/faq/zh-tw/page.yaml
        fields:
          - name: faqs
            label: "問答列表"
            widget: list
            fields: *faq_fields
      - name: faq-en
        label: "FAQ (English)"
        file: src/content/faq/en/page.yaml
        fields:
          - name: faqs
            label: "Q&A List"
            widget: list
            fields: *faq_fields
      - name: faq-ja
        label: "FAQ（日本語）"
        file: src/content/faq/ja/page.yaml
        fields:
          - name: faqs
            label: "Q&Aリスト"
            widget: list
            fields: *faq_fields

  # ── 頁面內容（三語）────────────────────────
  - name: pages
    label: "頁面內容"
    files:
      - name: home-zh-tw
        label: "首頁（繁中）"
        file: src/content/pages/zh-tw/home.yaml
        fields:
          - {name: seoTitle, label: "SEO 標題", widget: string}
          - {name: seoDescription, label: "SEO 描述", widget: text}
          - {name: navCtaText, label: "導覽列按鈕文字", widget: string}
          - {name: heroTitle, label: "Hero 大標題", widget: string}
          - {name: heroSubtitle, label: "Hero 副標題", widget: text}
          - {name: ctaPrimary, label: "主要按鈕文字", widget: string}
          - {name: ctaSecondary, label: "次要按鈕文字", widget: string}
          - {name: ctaSecondaryLink, label: "次要按鈕連結", widget: string}
          - {name: featuresTitle, label: "功能區標題", widget: string}
          - name: features
            label: "功能列表"
            widget: list
            fields:
              - {name: icon, label: Emoji, widget: string}
              - {name: title, label: "功能名稱", widget: string}
              - {name: desc, label: "功能說明", widget: text}
          - {name: storyTitle, label: "品牌故事標題", widget: string}
          - {name: storyEyebrow, label: "品牌故事前言", widget: string}
          - {name: storyContent, label: "品牌故事內容", widget: text}
          - {name: ctaTitle, label: "CTA 標題", widget: string}
          - {name: ctaButton, label: "CTA 按鈕文字", widget: string}
      - name: home-en
        label: "Home Page (English)"
        file: src/content/pages/en/home.yaml
        fields:
          - {name: seoTitle, label: "SEO Title", widget: string}
          - {name: seoDescription, label: "SEO Description", widget: text}
          - {name: navCtaText, label: "Nav CTA Text", widget: string}
          - {name: heroTitle, label: "Hero Title", widget: string}
          - {name: heroSubtitle, label: "Hero Subtitle", widget: text}
          - {name: ctaPrimary, label: "Primary Button Text", widget: string}
          - {name: ctaSecondary, label: "Secondary Button Text", widget: string}
          - {name: ctaSecondaryLink, label: "Secondary Button Link", widget: string}
          - {name: featuresTitle, label: "Features Title", widget: string}
          - name: features
            label: "Features"
            widget: list
            fields:
              - {name: icon, label: Emoji, widget: string}
              - {name: title, label: "Feature Name", widget: string}
              - {name: desc, label: "Description", widget: text}
          - {name: storyTitle, label: "Story Title", widget: string}
          - {name: storyEyebrow, label: "Story Eyebrow", widget: string}
          - {name: storyContent, label: "Story Content", widget: text}
          - {name: ctaTitle, label: "CTA Title", widget: string}
          - {name: ctaButton, label: "CTA Button Text", widget: string}
      - name: home-ja
        label: "ホームページ（日本語）"
        file: src/content/pages/ja/home.yaml
        fields:
          - {name: seoTitle, label: "SEOタイトル", widget: string}
          - {name: seoDescription, label: "SEO説明文", widget: text}
          - {name: navCtaText, label: "ナビCTAテキスト", widget: string}
          - {name: heroTitle, label: "ヒーロータイトル", widget: string}
          - {name: heroSubtitle, label: "ヒーローサブタイトル", widget: text}
          - {name: ctaPrimary, label: "メインボタンテキスト", widget: string}
          - {name: ctaSecondary, label: "サブボタンテキスト", widget: string}
          - {name: ctaSecondaryLink, label: "サブボタンリンク", widget: string}
          - {name: featuresTitle, label: "機能タイトル", widget: string}
          - name: features
            label: "機能リスト"
            widget: list
            fields:
              - {name: icon, label: Emoji, widget: string}
              - {name: title, label: "機能名", widget: string}
              - {name: desc, label: "説明", widget: text}
          - {name: storyTitle, label: "ストーリータイトル", widget: string}
          - {name: storyEyebrow, label: "ストーリー前文", widget: string}
          - {name: storyContent, label: "ストーリー内容", widget: text}
          - {name: ctaTitle, label: "CTAタイトル", widget: string}
          - {name: ctaButton, label: "CTAボタン", widget: string}

  # ── チュートリアル（三語）──────────────────────
  - name: tutorial
    label: "チュートリアル / Tutorial / 使用教學"
    files:
      - name: tutorial-zh-tw
        label: "使用教學（繁中）"
        file: src/content/tutorial/zh-tw/page.yaml
        fields:
          - {name: seoTitle, label: "SEO 標題", widget: string, required: false}
          - {name: seoDescription, label: "SEO 描述", widget: text, required: false}
          - {name: pageTitle, label: "頁面標題", widget: string}
          - {name: pageSubtitle, label: "頁面副標題", widget: string}
          - name: sections
            label: "教學章節"
            widget: list
            fields: *tutorial_section_fields
          - {name: ctaTitle, label: "CTA 標題", widget: string}
          - {name: ctaSubtitle, label: "CTA 副標題", widget: string}
          - {name: ctaButton, label: "CTA 按鈕文字", widget: string}
      - name: tutorial-en
        label: "Tutorial (English)"
        file: src/content/tutorial/en/page.yaml
        fields:
          - {name: seoTitle, label: "SEO Title", widget: string, required: false}
          - {name: seoDescription, label: "SEO Description", widget: text, required: false}
          - {name: pageTitle, label: "Page Title", widget: string}
          - {name: pageSubtitle, label: "Page Subtitle", widget: string}
          - name: sections
            label: "Tutorial Sections"
            widget: list
            fields: *tutorial_section_fields
          - {name: ctaTitle, label: "CTA Title", widget: string}
          - {name: ctaSubtitle, label: "CTA Subtitle", widget: string}
          - {name: ctaButton, label: "CTA Button Text", widget: string}
      - name: tutorial-ja
        label: "チュートリアル（日本語）"
        file: src/content/tutorial/ja/page.yaml
        fields:
          - {name: seoTitle, label: "SEOタイトル", widget: string, required: false}
          - {name: seoDescription, label: "SEO説明文", widget: text, required: false}
          - {name: pageTitle, label: "ページタイトル", widget: string}
          - {name: pageSubtitle, label: "サブタイトル", widget: string}
          - name: sections
            label: "チュートリアルセクション"
            widget: list
            fields: *tutorial_section_fields
          - {name: ctaTitle, label: "CTA タイトル", widget: string}
          - {name: ctaSubtitle, label: "CTA サブタイトル", widget: string}
          - {name: ctaButton, label: "CTA ボタンテキスト", widget: string}
