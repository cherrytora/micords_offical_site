storyEyebrow: It started with Lily and Lara
storyTitle: Our Story
storyContent: |-
  It began when our orange cat, Lara, was diagnosed with hyperthyroidism.

  Just two days later, our white cat, Lily, suddenly stopped eating and drinking. Tests revealed pancreatitis and Stage 2 chronic kidney disease. Both cats became ill at nearly the same time, and from then on needed ongoing follow-up care.

  During that time, we travelled back and forth between different hospitals and clinics. Each visit came with different tests, reference ranges, and past values to compare. Before every appointment, we searched through notes and reports, trying to remember the last numbers and what the vet had said.

  When a new report arrived, it was hard to tell at a glance: over the past few weeks, were things improving, staying stable, or was a value slowly starting to change?

  Their follow-up appointments were often only a day or two apart. When the vet asked about recent changes, we would occasionally mix up the two cats' values and give an answer that even the vet had to double-check.

  Those hectic days led us to build a tool made for tracking cats' health.

  “Turn your love for your cat into health records you can follow.”

  From daily meals, water intake, weight, and everyday wellbeing to vet visits, blood test results, and long-term changes, Micords helps keep it all in one place. At the next appointment, there is no need to piece everything together from memory — you can clearly see your cat's health journey.

  That is how Micords began: with Lara and Lily's health records.

  It was built by two cats' human and her younger brother, who joined the project through a little sibling pressure, and is shared with every pet parent who cares deeply for their companion.

  For your cat's records, choose Micords.
