storyTitle: Our Story
storyContent: >-
  It started when we discovered our orange cat Lara had hyperthyroidism. A few days later, our white cat Lily stopped eating and drinking — a trip to the vet revealed pancreatitis and Stage 2 chronic kidney disease. Both cats fell ill almost simultaneously and needed long-term monitoring.


  During months of hospital visits, we kept flipping through notes trying to recall previous values and what the vets had said — because every clinic had different reference ranges.


  After getting test results, we couldn't immediately tell whether things had improved over the past few weeks. With both cats' appointments just two days apart on weekdays, we'd sometimes mix them up and give the vet a confused answer.


  That feeling of chaos led us to build a tool: "Turn your love for your cat into traceable health records." Whether you want to log daily routines or need medical data for vet visits, Micords makes it easy.


  Micords was built by two cats' devoted owners and a brother who got roped in. We're sharing it with every pet parent out there.


  Cat records — that's what Micords is for.
ctaTitle: Recording is the best care.
