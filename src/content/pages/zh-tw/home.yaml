storyEyebrow: 從利利與拉拉開始
storyTitle: 品牌故事
storyContent: |-
  事情的開始，是橘貓拉拉被診斷出甲狀腺機能亢進。

  沒想到才過兩天，白貓利利突然不吃不喝，檢查後發現是胰臟炎和慢性腎病第二期。兩隻貓幾乎同時生病，也從那時候開始，需要長期回診與追蹤。

  那段時間，我們帶著牠們在不同的醫院、診所之間來回。每次看診的檢查項目、參考範圍和過去數值都不太一樣，看診前總要翻筆記、找報告，努力回想上次的數值是多少、醫生說過什麼。

  新的檢查報告出來時，也很難第一時間看出：這幾個禮拜下來，到底是變好了、維持穩定，還是有哪個數值正在慢慢改變？

  偏偏兩隻貓的回診時間常常只差一兩天。醫生問起最近的狀況時，偶爾還會把兩隻貓的數值記反，講出一個連醫生聽了都忍不住再確認一次的答案。

  就是這段手忙腳亂的日子，讓我們決定做一個真正適合貓咪健康追蹤的工具。

  「把對貓咪的愛，變成有跡可循的健康紀錄。」

  無論是每天的吃飯、喝水、體重與生活狀況，還是看診紀錄、血檢數值與長期變化，都希望能透過 Micords 好好留下來。需要回診時，不必再靠記憶拼湊，而是能清楚看見牠一路走來的健康變化。

  Micords 就這樣，從拉拉和利利的健康紀錄開始。

  由兩隻貓的奴才，和被她以血緣壓制一起加入開發的弟弟共同打造，也分享給每一位認真照顧毛孩的家長。

  貓咪紀錄，就找 Micords。
