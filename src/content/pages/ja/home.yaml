seoTitle: Micords — 猫の健康・医療記録、インストール不要
seoDescription: MicordsはPWA技術を使用した猫専用の健康記録アプリです。食事・体重・血液検査・投薬を記録し、自動でトレンドグラフを生成。診察時にワンタップで完全な記録を表示。コア機能は無料。
navCtaText: 今すぐ試す
heroTitle: Micords — 猫の健康・医療記録、インストール不要
heroSubtitle: 毎日の食事や飲水から、診察・血液検査・投薬まで、Micordsがケアの記録をまとめます。ホーム画面のクイック記録と毎日の給餌・投薬チェックで、忙しい日でも大切なケアを見逃しません。
