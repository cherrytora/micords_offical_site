featuresTitle: 1つのアプリで、毎日のケアを
features:
  - icon: 📝
    title: 日常記録
    desc: 食事・飲水・排泄を手軽に記録、自動で整理。
  - icon: 📈
    title: 健康トレンドグラフ
    desc: 体重・血液検査データを可視化。変化がひと目でわかる。
  - icon: 🏥
    title: 完全な医療記録
    desc: 投薬・診断・血液検査、すべてを一元管理。もう記録を探し回る必要なし。
  - icon: 🔔
    title: スマートリマインダー
    desc: ワクチン・駆虫・診察・投薬、時間になったら自動通知。
  - icon: 💯
    title: 健康スコア
    desc: 日常記録から総合的に自動評価。スコア一つで今の健康状態がひと目でわかる。
  - icon: ⚠️
    title: 健康リスク警告
    desc: 猫は痛みを隠す。データに異常なトレンドが出たら早めにお知らせ。
storyTitle: ブランドストーリー
storyContent: >-
  きっかけは、オレンジ猫のラーラに甲状腺機能亢進症が見つかったことでした。その数日後、白猫のリーリーが食欲・飲水ともに低下し、病院へ連れて行くと膵炎と慢性腎臓病2期と診断されました。ほぼ同時に2匹が発症し、長期的なモニタリングが必要になりました。


  何ヶ月もの通院を重ねる中、クリニックごとに参考値が異なるため、毎回ノートをめくって以前の数値や医師の言葉を思い出そうとしていました。


  検査結果が出ても、ここ数週間で改善しているのかどうかすぐに判断できませんでした。2匹の診察日が平日で2日しか違わないため、医師も混乱してしまうことがありました。


  そのバタバタした経験が、このツールを作るきっかけになりました：「猫への愛を、追跡可能な健康記録に変えよう」。日常記録でも医療データでも、Micordsで簡単に管理できます。


  Micordsは、2匹の猫の飼い主と、巻き込まれた弟の3人で作りました。すべてのペット親に贈ります。


  猫の記録は、Micordsで。
ctaTitle: 記録することが、最高のケア。
