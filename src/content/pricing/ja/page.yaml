notes:
  - title: "📅 サブスクリプション"
    items:
      - "各アカウントにつき1回、30日間のPremium無料トライアルをご利用いただけます。無料トライアル中に支払い情報の登録は必要ありません。"
      - "無料トライアル終了後はFreeプランに自動的に戻ります。Premiumを自ら購読しない限り、料金は請求されません。"
      - "月払いは毎月自動更新。年払いは12ヶ月分を一括払いで自動更新（年払い）。"
      - "キャンセル後も現在の期間終了まで利用可能。"
      - "年払いは月払いより約18%お得です。"
      - "Micordsはプラン内容を変更する場合があります。既存の購読特典に重要な影響を及ぼす変更については、合理的な方法で事前にお知らせします。"

  - title: "💳 返金ポリシー"
    items:
      - "月払い・年払いどちらにも適用されます。"
      - "支払いから7日以内：全額返金対応。"
      - "7日経過後：返金不可。ただし、いつでも次回以降のサブスクリプションをキャンセルできます。"
      - "キャンセル後も現在の期間終了まで引き続きご利用いただけます。"
      - "特別例外：システム障害による重複請求 / 予告なしの72時間以上のサービス停止 / サポートが確認した請求エラー。"
      - '返金をご希望の場合は、<a href="https://docs.google.com/forms/d/e/1FAIpQLSct6PAw6GrwWH1swOEKO6GtUQQYo6Zqme5l8JHT9LgQTU9QmQ/viewform" target="_blank" rel="noopener noreferrer" class="text-brand-orange hover:underline font-semibold">返金フォーム</a>（登録メールアドレス・支払日・理由を記入）を送信してください → 3営業日以内にメールで回答 → 承認後14営業日以内にカードへ返金。'
      - 'サブスクリプションや返金に関するご質問は、<a href="https://cherrytora.github.io/micords_offical_site/contact/" class="text-brand-orange hover:underline font-semibold">お問い合わせ</a>ページをご覧ください。'

