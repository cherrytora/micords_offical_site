notes:
  - title: "📅 訂閱與計費"
    items:
      - "新用戶可享有 30 天 Pro 方案免費試用，每個帳號限用一次。"
      - "月繳方案每月自動扣款；年繳方案一次支付 12 個月費用，系統自動續約。"
      - "取消後仍可使用至本期訂閱結束，不會立即失效。"
      - "年繳比月繳省約 24%，適合長期使用的貓奴。"

  - title: "💳 退款政策"
    items:
      - "訂閱後 14 天內可申請全額退款。"
      - "超過 14 天後，僅能取消下個週期的自動續費，當期費用不予退還。"
      - "退款申請請聯絡 Threads @rela2cats 或填寫意見回饋表單。"

  - title: "☁️ 服務型態說明"
    items:
      - "Micords 為 SaaS 雲端訂閱服務，無實體商品。"
      - "訂閱後立即開通，透過網際網路提供所有功能，不進行實體配送。"
      - "所有資料儲存於雲端，支援跨裝置使用。"

  - title: "🧵 聯絡我們"
    items:
      - "有方案疑問、退款申請或功能建議，歡迎透過以下管道聯絡。"

