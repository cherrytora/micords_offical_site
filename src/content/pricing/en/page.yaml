notes:
  - title: "📅 Subscription & Billing"
    items:
      - "Each account can use one 30-day Premium free trial, with no payment information required."
      - "At the end of the free trial, your account returns to the Free plan. You will not be charged unless you actively subscribe to Premium."
      - "Monthly plans auto-renew each month. Annual plans are billed once for 12 months and auto-renew annually."
      - "After cancellation, access continues until the end of the current billing period."
      - "Annual saves ~18% compared to monthly billing."
      - "Micords may modify plan content. We will provide reasonable prior notice of material changes affecting existing subscription benefits."

  - title: "💳 Refund Policy"
    items:
      - "Applies to both monthly and annual plans."
      - "Within 7 days of payment: full refund available."
      - "After 7 days: no refunds, but you may cancel future renewals at any time."
      - "Access continues until the end of the current billing period after cancellation."
      - "Special exceptions: duplicate charges from system errors / service outage exceeding 72 hours / billing errors confirmed by support."
      - 'To request a refund, fill out the <a href="https://docs.google.com/forms/d/e/1FAIpQLSct6PAw6GrwWH1swOEKO6GtUQQYo6Zqme5l8JHT9LgQTU9QmQ/viewform" target="_blank" rel="noopener noreferrer" class="text-brand-orange hover:underline font-semibold">refund form</a> (include registered email, payment date, and reason) → email reply within 3 business days → refund to card within 14 business days.'
      - 'For subscription or refund inquiries, visit our <a href="https://cherrytora.github.io/micords_offical_site/contact/" class="text-brand-orange hover:underline font-semibold">Contact Us</a> page for more options.'

