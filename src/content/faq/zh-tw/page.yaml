faqs:
  - question: Micords 是什麼？
    answer: Micords 是一款專為貓咪設計的健康紀錄小工具，名稱來自「貓（Mi）+ Records」。支援快速紀錄、今日照護打卡、飲食與體重追蹤、血檢管理、用藥提醒、記帳簿與物品倉庫等功能，幫助每位貓奴全面掌握毛孩的健康狀況。使用 PWA 技術，iPhone、Android 都可以加到主畫面當 APP 用，電腦網頁也能直接開啟！
  - question: Micords 是免費的嗎？
    answer: Micords 提供免費版與付費版方案，你可以依照需求選擇。查看完整的<a href="https://cherrytora.github.io/micords_offical_site/pricing/" class="text-brand-orange hover:underline font-semibold">方案與價格</a>。
  - question: 什麼是 PWA？需要去 App Store 下載嗎？
    answer: 不需要！Micords 是 PWA（Progressive Web App），直接用手機瀏覽器開啟網址，點選「加入主畫面」就可以安裝到手機桌面。iOS（Safari）和 Android（Chrome）都支援，完全不需要透過 App Store 或 Google Play 下載。
  - question: 如何註冊帳號？支援哪些登入方式？
    answer: Micords 目前僅支援 Google 帳號登入，不需要另外設定密碼。直接點選「以 Google 登入」，選擇你的 Google 帳號即可完成註冊與登入，不用擔心忘記密碼的問題。
  - question: 可以在多個裝置上使用嗎？資料會同步嗎？
    answer: 完全沒問題！Micords 的資料儲存在雲端，只要用同一個 Google 帳號登入，不論是手機、平板還是電腦，所有紀錄都會即時同步。在手機上新增的紀錄，馬上就能在電腦上看到。
  - question: 狗狗也可以用嗎？
    answer: 當然歡迎狗狗使用！不過 Micords 是以貓咪為核心設計的服務，血檢參考值、健康警示等都是以貓咪的標準為依據。如果只是作為日常紀錄工具，飲食、體重、用藥、看診等功能狗狗完全適用；但涉及血檢數值解讀或相關警示時，就無法直接套用，需要自行對照獸醫提供的參考標準。
  - question: 可以同時記錄多隻貓嗎？
    answer: 支援多貓！貓口數量依方案而有所不同：免費方案可新增 2 隻、PRO 方案最多 5 隻、PREMIUM 方案則無上限，多貓家庭完全沒問題。
  - question: 血檢紀錄怎麼使用？
    answer: 每次看診拿到血檢報告後，在 Micords 的「血檢紀錄」功能中輸入各項數值（如 BUN、Creatinine、ALT 等），也支援AI辨識輸入，只要拿手機上傳血檢報告照片就會自動填入血檢數值囉！Micords 會自動生成趨勢圖表，讓你一眼看出數值變化方向，下次看診時可以直接給獸醫參考。
  - question: Micords 有記帳功能嗎？
    answer: 有！Micords 內建記帳簿功能，可以記錄每次看診費用、買貓糧、貓砂、藥品等各類支出，幫助你掌握養貓的花費，做好財務規劃。
  - question: 物品倉庫功能是什麼？
    answer: 物品倉庫可以管理家裡的貓咪用品庫存，例如貓糧、貓砂、藥品、保健品等。你可以記錄品項、數量、效期，快用完時就能提早補貨，再也不用臨時找不到東西或記不住什麼時候到期。
  - question: 看診時怎麼用 Micords 幫助溝通？
    answer: 看診前，可以在 Micords 查看最近的飲食、體重、血檢和用藥紀錄；看診時，直接把手機遞給獸醫，或口頭說明近期趨勢。完整的紀錄讓你不再只能說「好像有點瘦」，而是秀出三個月的體重趨勢圖，讓溝通更精準有效率。
  - question: 可以匯出或備份資料嗎？
    answer: 可以！Micords 支援將日常紀錄與醫療紀錄分別匯出為 PDF 檔案，方便保存或帶去看診時使用。
  - question: Micords 最近新增了哪些功能？
    answer: Micords 新增了首頁快速紀錄與今日照護打卡。你可以設定每天固定的餵食餐次與正在服用的藥物，在首頁直接完成紀錄；常用的飲食、喝水、體重等項目也能快速開啟填寫。
  - question: 什麼是今日照護打卡？
    answer: 今日照護會依照你設定的固定餐次與用藥內容，整理成每天的餵食與給藥清單。完成後直接點選打卡即可，同時會寫入對應紀錄，方便回頭查看照護是否有完成。
  - question: 快速紀錄可以記哪些事？
    answer: 快速紀錄可放入常用的日常項目，例如乾糧、罐頭、喝水、補水餐包、體重、排尿、排便、嘔吐、吃藥、打皮下與血壓等。每位使用者最多可挑選四個最常用的項目，也可以加入自訂項目。
  - question: 健康指數和風險提醒是診斷嗎？
    answer: 不是。健康指數與風險提醒是依照紀錄與數據變化提供的輔助資訊，幫助你更早發現值得留意的狀況；它們不能取代獸醫師診斷。若貓咪出現異常、精神或食慾明顯改變，請儘快諮詢合格獸醫師。
  - question: 我的資料安全嗎？
    answer: "Micords 重視用戶隱私與資料安全。你的寵物健康數據僅供你個人使用，不會被分享給第三方，Micords 的開發人員也不會進入資料庫觀看你輸入的任何資料。如有任何疑慮，歡迎透過官方 <a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> 或意見表單聯絡我們。"
  - question: 如何刪除帳號或清除所有資料？
    answer: "你可以在 APP 設定中申請刪除帳號。提交刪除申請後，系統會在七天內自動清除你的帳號與所有相關資料。若有任何疑問，也可以透過 <a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> 或意見表單聯絡我們。"
  - question: 如何提供功能建議或回報問題？
    answer: "歡迎透過官方 <a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> 或意見回饋表單聯絡我們。你的每一個建議都會被認真考量，並可能成為下一個版本的新功能！"
