faqs:
  - question: Micordsとは何ですか？
    answer: Micordsは猫のために設計された健康記録ツールです。名前は「Mi（猫）+ Records」に由来します。食事記録、体重管理、血液検査管理、投薬リマインダー、支出記録、用品在庫管理などの機能を備え、すべての猫の飼い主が愛猫の健康を総合的に管理できます。PWA技術を採用しており、iPhoneでもAndroidでもホーム画面に追加してアプリのように使えます。もちろんパソコンのブラウザでも直接利用できます。
  - question: Micordsは無料ですか？
    answer: Micordsは現在ベータテスト中です。ベータ参加者は将来も完全に無料でご利用いただけます。スマートフォンのブラウザで直接開くか、PWA（プログレッシブウェブアプリ）としてインストールすることで、ネイティブアプリのような使用感を楽しめます。
  - question: PWAとは何ですか？App Storeからダウンロードする必要はありますか？
    answer: 不要です！MicordsはPWA（Progressive Web App）です。スマートフォンのブラウザでURLを開き、「ホーム画面に追加」をタップするだけでインストールできます。iOS（Safari）とAndroid（Chrome）の両方に対応しており、App StoreやGoogle Playのダウンロードは一切不要です。
  - question: アカウントの登録方法は？どのログイン方法に対応していますか？
    answer: MicordsはGoogleアカウントのみでのログインに対応しています。「Googleでログイン」をタップしてアカウントを選択するだけで登録・ログインが完了します。パスワードの設定は不要なので、パスワードを忘れる心配もありません。
  - question: 複数のデバイスで使用できますか？データは同期されますか？
    answer: もちろんです！データはクラウドに保存されているため、同じGoogleアカウントでログインすれば、スマートフォン・タブレット・パソコンなど、どのデバイスからでもリアルタイムで同期されます。
  - question: 犬にも使えますか？
    answer: 犬ももちろん歓迎です！ただし、Micordsは猫を中心に設計されたサービスのため、血液検査の参考値や健康アラートはすべて猫の基準に基づいています。日常記録ツールとして使う分には、食事・体重・投薬・診察などの機能は犬にも問題なくご利用いただけます。ただし、血液検査の数値解釈や関連アラートは直接適用できないため、獣医師が提供する参考値と照合する必要があります。
  - question: 複数の猫を記録できますか？
    answer: "複数頭に対応しています！頭数はプランによって異なります：無料プランは2匹まで、PROプランは最大5匹、PREMIUMプランは無制限です。多頭飼いのご家庭も安心です。"
  - question: 血液検査記録はどのように使いますか？
    answer: 診察後に血液検査報告書が手に入ったら、Micordsの「血液検査記録」機能で各項目の値（BUN・Creatinine・ALTなど）を入力してください。AI入力補助もあり、血液検査報告書の写真をアップロードするだけで自動入力されます！Micordsが自動でトレンドグラフを生成し、数値の変化が一目でわかります。次回の診察でそのまま獣医師に見せることができます。
  - question: Micordsには支出管理機能はありますか？
    answer: あります！Micordsには内蔵の家計簿機能があり、診察費用、キャットフード、猫砂、薬品などの支出を記録できます。猫の飼育費を把握し、家計管理に役立てましょう。
  - question: 用品在庫機能とは何ですか？
    answer: 用品在庫では、家にある猫用品の在庫を管理できます（キャットフード・猫砂・薬品・サプリメントなど）。品目・数量・有効期限を記録し、なくなりそうになったら早めに補充できます。もう在庫を探し回ったり、期限を忘れたりする心配はありません。
  - question: 診察時にMicordsをどのように活用しますか？
    answer: 診察前に、Micordsで最近の食事・体重・血液検査・投薬記録を確認します。診察中は、スマートフォンを獣医師に渡したり、最近のトレンドを口頭で説明したりします。「少し痩せたかも」と言う代わりに、3ヶ月の体重トレンドグラフを見せることで、より正確で効率的なコミュニケーションが取れます。
  - question: データのエクスポートやバックアップはできますか？
    answer: できます！Micordsは日常記録と医療記録をそれぞれPDFとしてエクスポートする機能に対応しています。バックアップとして保存したり、診察時に持参したりするのに便利です。
  - question: データは安全ですか？
    answer: "Micordsはユーザーのプライバシーとデータセキュリティを重視しています。あなたのペットの健康データは個人使用のみで、第三者と共有されることはありません。Micordsの開発者もあなたが入力したデータにアクセスすることはありません。ご不明な点があれば、公式 <a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> またはフィードバックフォームよりご連絡ください。"
  - question: アカウントを削除したり、すべてのデータを消去するにはどうすればよいですか？
    answer: "アプリの設定からアカウントの削除申請ができます。申請後、7日以内にアカウントとすべての関連データが自動的に削除されます。ご不明な点は、<a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> またはフィードバックフォームよりお問い合わせください。"
  - question: 機能のリクエストや問題の報告はどうすれば？
    answer: "公式 <a href='https://www.threads.com/@rela2cats' target='_blank' rel='noopener noreferrer' class='text-brand-orange hover:underline'>Threads @rela2cats</a> またはフィードバックフォームでご連絡ください。いただいたご意見はすべて真剣に検討され、次のバージョンの新機能になるかもしれません！"
